          variable: difficulty
        - label: 主题核心目标
          max_length: 500
          required: true
          type: paragraph
          variable: goal
      height: 186
      id: start
      position:
        x: 40
        y: 280
      positionAbsolute:
        x: 40
        y: 280
      selected: false
      type: custom
      width: 242
    - data:
        code: "import json\n\nREQ = [\n    \"scriptName\", \"difficulty\", \"actorName\"\
          , \"actorPosition\",\n    \"actorCompany\", \"actorType\", \"actorPersonality\"\
          ,\n    \"actorCommunicationStyle\", \"scriptBackground\", \"scriptOpening\"\
          ,\n]\n\ndef main(arg0, difficulty: str) -> dict:\n    # 1. 兼容：结构化对象 or JSON\
          \ 字符串\n    if isinstance(arg0, str):\n        t = arg0.strip()\n       \
          \ # 去掉可能的 markdown 代码块\n        if t.startswith(\"```\"):\n            t\
          \ = t.strip(\"`\")\n            t = t.replace(\"json\\n\", \"\", 1).strip()\n\
          \        try:\n            c = json.loads(t)\n        except Exception as\
          \ e:\n            raise ValueError(f\"output is not valid JSON: {e}\")\n\
          \    elif isinstance(arg0, dict):\n        c = arg0\n    else:\n       \
          \ raise ValueError(f\"unsupported arg0 type: {type(arg0)}\")\n\n    # 2.\
          \ 必填字段校验\n    miss = [k for k in REQ if not c.get(k)]\n    if miss:\n  \
          \      raise ValueError(\"missing fields: \" + \",\".join(miss))\n\n   \
          \ # 3. 字段级校验\n    if len(c[\"scriptOpening\"]) < 40:\n        raise ValueError(\"\
          scriptOpening too short (<40)\")\n    if len(c[\"scriptOpening\"]) > 200:\n\
          \        raise ValueError(\"scriptOpening too long (>200)\")\n    if len(c[\"\
          scriptName\"]) > 25:\n        raise ValueError(\"scriptName too long (>25)\"\
          )\n\n    # 4. 难度归一化\n    try:\n        c[\"difficulty\"] = int(difficulty)\n\
          \    except Exception:\n        raise ValueError(f\"invalid difficulty:\
          \ {difficulty}\")\n    if c[\"difficulty\"] not in (1, 2, 3):\n        raise\
          \ ValueError(\"difficulty must be 1/2/3\")\n\n    # 5. 可选字段兜底\n    for k\
          \ in (\"actorPosition\", \"actorCompany\", \"actorCommunicationStyle\"):\n\
          \        c.setdefault(k, \"\")\n\n    return {\"case_json\": json.dumps(c,\
          \ ensure_ascii=False)}"
        code_language: python3
        outputs:
          case_json:
            type: string
        selected: false
        title: 解析与字段校验
        type: code
        variables:
        - value_selector:
          - '1789698897396'
          - structured_output
          value_type: object
          variable: arg0
        - value_selector:
