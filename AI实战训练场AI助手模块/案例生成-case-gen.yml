        selected: false
        title: 结束
        type: end
      height: 88
      id: end
      position:
        x: 940
        y: 280
      positionAbsolute:
        x: 940
        y: 280
      selected: false
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.6
          mode: chat
          name: Qwen/Qwen3-30B-A3B-Instruct-2507
          provider: yangyaofei/vllm/vllm
        prompt_template:
        - id: c436dc63-59ff-44a2-b169-585f88a8ec9e
          role: system
          text: "你是资深情景剧本编剧，擅长把培训场景改写成有张力的实战对话案例。你要为学员设计一个“AI 陪练角色”，让学员在该角色的对抗/协作中练习目标能力。你只输出\
            \ JSON，不输出解释、标题或 markdown 代码块。\n\n## 输入\n主题目标：{{#start.goal#}}\n场景定义：{{#start.scenario_json#}}\n\
            可选客户画像（优先从中选角色原型）：{{#start.customer_profiles#}}\n难度：{{#start.difficulty#}}（1简单：单点诉求、态度温和；2中等：两个诉求叠加、有情绪波动；3困难：施压对抗、抛出合规/利益威胁、带隐藏动机）\n\
            \n## 生成要求\n\n### 1. scriptName\n格式：“冲突主题：化解方式”，不超过 25 字。\n示例：“高压催单下的精准录入：特殊包装与地址核对的生死线”\n\
            \n### 2. 角色设定（学员的对话对象）\n- actorName：常见中文名\n- actorPosition / actorCompany：贴合业务的职位与公司名，可用“宏达科技”类虚构名，禁止使用真实企业名\n\
            - actorType：身份一句话\n- actorPersonality：3~5 个性格词 + 一句行为化说明\n  示例：“强势、急躁、结果导向；说话直来直去，习惯用\
            \ deadline 压人。”\n- actorCommunicationStyle：沟通风格具体化，必须包含语速、口头禅、施压方式\n \
            \ 示例：“语速快，常打断对方；口头禅‘我不管过程’；习惯用‘今天不解决就换供应商’施压。”\n\n### 3. scriptBackground\n\
            300 字内情境铺垫，必须包含：\n- 学员身份\n- 事件起因\n- 角色处境与立场\n- 双方利益关系\n必须呼应场景的 coreConflict，禁止与场景无关的背景。\n\
            \n### 4. scriptOpening\n角色的开场白，150 字内（40~200 字）。\n必须包含：\n- （情绪/动作舞台指示）\n\
            - 直接抛出冲突的台词\n- 至少 1 个具体业务细节：数字、期限、条款、金额、单号等\n情绪强度必须与难度匹配：\n- 难度 1：温和提问，情绪平稳\n\
            - 难度 2：明显不满，语气加重\n- 难度 3：拍桌/威胁式开场，带施压或最后通牒\n台词要口语化，让学员一读就能进入情境。\n\n###\
            \ 5. 动机与施压点\n角色动机、施压点必须来自场景的 coreConflict 与 difficulties，禁止与场景无关的冲突，禁止编造材料外事实。\n\
            \n## 输出（仅输出 JSON）\n{\"scriptName\":\"…\",\"difficulty\":{{#start.difficulty#}},\"\
            actorName\":\"…\",\"actorPosition\":\"…\",\"actorCompany\":\"…\",\"actorType\"\
            :\"…\",\"actorPersonality\":\"…\",\"actorCommunicationStyle\":\"…\",\"\
            scriptBackground\":\"…\",\"scriptOpening\":\"…\"}"
        selected: true
        structured_output:
          schema:
            additionalProperties: false
            properties:
              actorCommunicationStyle:
                type: string
              actorCompany:
                type: string
              actorName:
                type: string
              actorPersonality:
                type: string
              actorPosition:
                type: string
              actorType:
                type: string
              difficulty:
                type: string
              scriptBackground:
                type: string
              scriptName:
                type: string
              scriptOpening:
                type: string
            required:
            - scriptName
            - difficulty
            - actorName
            - actorPosition
            - actorCompany
            - actorType
            - actorPersonality
            - actorCommunicationStyle
            - scriptBackground
            - scriptOpening
            type: object
        structured_output_enabled: true
        title: 生成实战案例剧本
        type: llm
        vision:
          enabled: false
      height: 87
      id: '1789698897396'
      position:
        x: 325
