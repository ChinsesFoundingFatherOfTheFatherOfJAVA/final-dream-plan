      source: '1789698897396'
      sourceHandle: source
      target: code_case
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - label: 场景定义JSON(含13项字段+维度)
          max_length: 8000
          required: true
          type: paragraph
          variable: scenario_json
        - label: 客户画像列表JSON
          max_length: 6000
          required: true
          type: paragraph
          variable: customer_profiles
        - label: 难度(1简单2中等3困难)
          max_length: 2
          required: true
