        code: "import json\n\ndef _load(t):\n    \"\"\"兼容 str / dict / list：str 才\
          \ json.loads，其他原样返回\"\"\"\n    v = t\n    for _ in range(5):\n        if\
          \ isinstance(v, str):\n            v = json.loads(v.strip())\n        else:\n\
          \            break\n    return v\n\ndef _as_list(v, key=None):\n    if isinstance(v,\
          \ dict):\n        if key and key in v:\n            v = v[key]\n       \
          \ elif len(v) == 1:\n            v = next(iter(v.values()))\n        else:\n\
          \            raise ValueError(f\"expected list, got dict keys={list(v.keys())}\"\
          )\n    if not isinstance(v, list):\n        raise ValueError(f\"expected\
          \ list, got {type(v).__name__}\")\n    return v\n\ndef _parse_materials(s):\n\
          \    \"\"\"材料摘要：空/纯文本/JSON数组字符串 → 统一为 list\"\"\"\n    if not s:\n      \
          \  return []\n    if isinstance(s, list):\n        return s\n    if isinstance(s,\
          \ str):\n        t = s.strip()\n        if t.startswith(\"[\"):\n      \
          \      try:\n                v = json.loads(t)\n                if isinstance(v,\
          \ list):\n                    return v\n            except json.JSONDecodeError:\n\
          \                pass\n        return [{\"summary\": s}]\n    return []\n\
          \ndef main(scenes_s, profiles_s, iceberg_s, criteria_s, materials_s):\n\
          \    scenes = _as_list(_load(scenes_s), \"scenes\")\n    crit = _load(criteria_s)\n\
          \    profiles = _as_list(_load(profiles_s), \"profiles\")\n    iceberg =\
          \ _load(iceberg_s)\n    if isinstance(iceberg, dict) and \"iceberg\" in\
          \ iceberg and len(iceberg) == 1:\n        iceberg = iceberg[\"iceberg\"\
          ]\n\n    for k in (\"sceneWeights\", \"dimensions\", \"defaultDimensionWeights\"\
          , \"passScore\"):\n        if k not in crit:\n            raise ValueError(f\"\
          criteria missing key: {k}\")\n\n    sw = {x[\"sceneId\"]: x[\"weights\"\
          ] for x in crit[\"sceneWeights\"]}\n    dim_ids = [d[\"id\"] for d in crit[\"\
          dimensions\"]]\n\n    scenarios = []\n    for s in scenes:\n        if not\
          \ isinstance(s, dict):\n            raise ValueError(f\"scene item is not\
          \ dict: {s!r}\")\n        w = sw.get(s[\"id\"], crit[\"defaultDimensionWeights\"\
          ])\n        if not isinstance(w, list):\n            raise ValueError(f\"\
          scene {s.get('id')} weights not list: {w!r}\")\n        assert abs(sum(x[\"\
          weight\"] for x in w) - 100) < 0.01, f\"scene {s['id']} weights != 100\"\
          \n        for x in w:\n            if not isinstance(x, dict) or \"dimensionId\"\
          \ not in x:\n                raise ValueError(f\"bad weight item: {x!r}\"\
          )\n            assert x[\"dimensionId\"] in dim_ids, f\"bad dim ref {x['dimensionId']}\"\
          \n        scenarios.append({\n            \"id\": s[\"id\"], \"name\": s[\"\
          name\"], \"audiences\": s[\"audiences\"],\n            \"businessGoal\"\
          : s[\"businessGoal\"], \"behaviorGoals\": s[\"behaviorGoals\"],\n      \
          \      \"relatedIcebergElements\": {},\n            \"businessImpact\":\
          \ s[\"businessImpact\"], \"failureCost\": s[\"failureCost\"],\n        \
          \    \"coreConflict\": s[\"coreConflict\"], \"failureReasons\": s[\"failureReasons\"\
          ],\n            \"difficulties\": s[\"difficulties\"],\n            \"constraints\"\
          : {\"forbidBehaviors\": s[\"forbidBehaviors\"], \"maxTime\": s[\"maxTime\"\
          ]},\n            \"relatedKnowledgeIds\": [], \"relatedScriptIds\": [],\
          \ \"relatedProductProfileArtifactIds\": [],\n            \"caseArtifactIds\"\
          : [], \"cases\": [],\n            \"dimensionWeights\": w\n        })\n\n\
          \    materials = _parse_materials(materials_s)\n\n    artifact = {\n   \
          \     \"materials\": materials, \"scenarios\": scenarios,\n        \"customerProfiles\"\
          : profiles, \"icebergModel\": iceberg,\n        \"evaluationCriteria\":\
          \ {\n            \"passScore\": crit[\"passScore\"],\n            \"dimensions\"\
          : crit[\"dimensions\"],\n            \"defaultDimensionWeights\": crit[\"\
          defaultDimensionWeights\"],\n        },\n        \"professionalKnowledge\"\
          : None, \"productProfiles\": [], \"version\": \"v1\"\n    }\n    return\
          \ {\"artifact_json\": json.dumps(artifact, ensure_ascii=False)}"
