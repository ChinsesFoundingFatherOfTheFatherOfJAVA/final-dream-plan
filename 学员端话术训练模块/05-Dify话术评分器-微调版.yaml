app:
  name: "话术评分器"
  description: "根据标准话术、要点和流转条件，评估学员的回答是否命中要点（学员端消息流转判定用；微调版：hit_points 要求与输入要点逐字一致）"
  mode: workflow
  icon: "📊"
  icon_background: "#E4FBCC"
  use_icon_as_answer_icon: false

dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: yangyaofei/vllm:0.2.3@455b644bfcfe0f8d7af1ad191a9e5d0b2d87214b0c6c804012d2d5cccdbbf88a
      version: null

kind: app
version: 0.5.0

workflow:
  conversation_variables: []
  environment_variables: []

  features:
    file_upload:
      image:
        enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""

  graph:
    nodes:
      - data:
          title: "开始"
          type: start
          variables:
            - variable: "standard_script"
              label: "标准话术"
              type: paragraph
              required: true
              max_length: 2000
            - variable: "key_points"
              label: "要点列表(JSON数组)"
              type: paragraph
              required: true
              max_length: 2000
            - variable: "pass_condition"
              label: "流转条件"
              type: paragraph
              required: true
              max_length: 1000
            - variable: "user_input"
              label: "学员输入"
              type: paragraph
              required: true
              max_length: 2000
        height: 182
        id: start
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      - data:
          title: "AI评分"
          type: llm
          model:
            provider: "yangyaofei/vllm/vllm"
            name: "Qwen/Qwen3-30B-A3B-Instruct-2507"
            mode: chat
            completion_params:
              temperature: 0.3
              max_tokens: 2048
          prompt_template:
            - role: system
              text: |
                你是一个专业的话术评分系统。根据标准话术、要点和流转条件，评估学员的回答。

                评估要点：
                1. 语义命中：学员回答只要在语义上明确表述了某要点内容本身（包括同义表述、口语化表述），即视为命中该要点，不要求字面一致
                2. 排除隐含命中：学员回答仅隐含与要点相关的需求、情绪或联想（如只说"好饿"表达饥饿感）而未明确表述要点内容时，不算命中。例如要点为"吃饭"："好饿"不算命中；"还没吃饭呢，正准备去吃饭"、"还没吃，等会儿去吃"算命中
                3. 命中判定只针对要点列表中列出的要点，不要自行引申新要点

                输出格式（JSON）：
                {
                  "hit_points": ["要点1", "要点2"],
                  "hit_count": 2,
                  "total_count": 5,
                  "comment": "评语",
                  "passed": true
                }

                注意（重要）：
                - hit_points: 命中的要点列表，每一条必须与输入要点列表中的内容【逐字一致、原样复制】，不得改写、缩写或增删字词
                - hit_count: hit_points 的条数
                - total_count: 输入要点列表的总条数
                - comment: 对学员回答的简短评语
                - passed: 按流转条件判断是否通过（命中任意N个要点或命中指定要点）
                - 只输出JSON，不要输出markdown代码块标记或其他文字
            - role: user
              text: |
                标准话术：{{#start.standard_script#}}

                要点：{{#start.key_points#}}

                流转条件：{{#start.pass_condition#}}

                学员回答：{{#start.user_input#}}

                请评估学员的回答。
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        height: 98
        id: llm_score
        position:
          x: 380
          y: 282
        positionAbsolute:
          x: 380
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      - data:
          title: "解析评分结果"
          type: code
          code_language: python3
          code: |
            import json

            def main(llm_output: str) -> dict:
                try:
                    cleaned = llm_output.strip()
                    if cleaned.startswith("```"):
                        cleaned = cleaned.split("\n", 1)[1]
                    if cleaned.endswith("```"):
                        cleaned = cleaned.rsplit("```", 1)[0]
                    # 容错：截取第一个 { 到最后一个 } 之间的内容
                    start_idx = cleaned.find("{")
                    end_idx = cleaned.rfind("}")
                    if start_idx >= 0 and end_idx > start_idx:
                        cleaned = cleaned[start_idx:end_idx + 1]
                    cleaned = cleaned.strip()

                    result = json.loads(cleaned)

                    return {
                        "hit_points": json.dumps(result.get("hit_points", []), ensure_ascii=False),
                        "hit_count": result.get("hit_count", 0),
                        "total_count": result.get("total_count", 0),
                        "comment": result.get("comment", ""),
                        "passed": result.get("passed", False),
                        "success": True
                    }
                except Exception as e:
                    return {
                        "hit_points": "[]",
                        "hit_count": 0,
                        "total_count": 0,
                        "comment": f"评分解析失败: {str(e)}",
                        "passed": False,
                        "success": False
                    }
          variables:
            - variable: "llm_output"
              value_selector: ["llm_score", "text"]
          outputs:
            hit_points:
              type: string
            hit_count:
              type: number
            total_count:
              type: number
            comment:
              type: string
            passed:
              type: string
            success:
              type: string
        height: 54
        id: parse_score
        position:
          x: 680
          y: 282
        positionAbsolute:
          x: 680
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      - data:
          title: "结束"
          type: end
          outputs:
            - variable: "hit_points"
              value_selector: ["parse_score", "hit_points"]
            - variable: "hit_count"
              value_selector: ["parse_score", "hit_count"]
            - variable: "total_count"
              value_selector: ["parse_score", "total_count"]
            - variable: "comment"
              value_selector: ["parse_score", "comment"]
            - variable: "passed"
              value_selector: ["parse_score", "passed"]
        height: 90
        id: end
        position:
          x: 980
          y: 282
        positionAbsolute:
          x: 980
          y: 282
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

    edges:
      - source: start
        target: llm_score
        sourceHandle: source
        targetHandle: target
        id: start-llm_score
        type: custom
        data:
          sourceType: start
          targetType: llm
          isLoop: false
      - source: llm_score
        target: parse_score
        sourceHandle: source
        targetHandle: target
        id: llm_score-parse_score
        type: custom
        data:
          sourceType: llm
          targetType: code
          isLoop: false
      - source: parse_score
        target: end
        sourceHandle: source
        targetHandle: target
        id: parse_score-end
        type: custom
        data:
          sourceType: code
          targetType: end
          isLoop: false

    viewport:
      x: 0
      y: 0
      zoom: 0.8
